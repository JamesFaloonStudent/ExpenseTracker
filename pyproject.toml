[project]
name = "expensetracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James Faloon", email = "faloonj@sheridancollege.ca" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "pydantic>=2.14.1",
]

[project.scripts]
expensetracker = "expensetracker:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
